name: evals

on:
  push:
  pull_request:

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: seed example data
        run: cp state.example.json state.json
      - name: core eval (drift=0, HITL gate, token reduction)
        run: python eval.py
      - name: dashboard invariants
        run: python eval_dashboard.py
      - name: time metadata, journal, stale (H1)
        run: python eval_h1.py
      - name: themes (verification-first)
        run: python eval_theme.py
      - name: done HITL gate (propose/confirm/reject)
        run: python eval_donepropose.py
      - name: agent journal cursor (diff / --advance)
        run: python eval_aicursor.py
      - name: readback (intent capture)
        run: python eval_intent.py
      - name: set-mode (focus / parked / normal)
        run: python eval_mode.py
      - name: groups, ownership, cross-project find
        run: python eval_grouping.py
      - name: phase progress derived from task groups
        run: python eval_phasegroup.py
      - name: stale milestones / expired focus surfaced
        run: python eval_deviations.py
      - name: phase-advance guardrails
        run: python eval_phase_feedback.py
